<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Research Space · ANE E2E</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f5f7fb;color:#172033}header{height:64px;padding:0 22px;background:#111c34;color:white;display:flex;align-items:center;justify-content:space-between}.wrap{display:grid;grid-template-columns:1fr 320px;gap:14px;padding:18px}.panel{background:white;border:1px solid #dce3ee;border-radius:14px;box-shadow:0 8px 24px #1720330d}.graph{position:relative;overflow:auto;min-height:780px}.inner{position:relative;width:1240px;min-height:780px;background-image:radial-gradient(#dce4f0 1px,transparent 1px);background-size:20px 20px}.node{position:absolute;width:190px;min-height:78px;padding:11px;border:1px solid #cad5e5;border-radius:10px;background:#fff;text-align:left;cursor:pointer}.node.question{border-color:#7298f5}.node.claim{border-color:#52b788}.node.evidence{border-color:#d6a84b}.node.debate,.node.position{border-color:#9575cd}.node.uncertainty{border-color:#e07a7a}.node.provenance,.node.review,.node.source{border-style:dashed}.tag{display:block;font-size:10px;font-weight:800;color:#63728a;text-transform:uppercase}.label{display:block;font-size:12px;line-height:1.35;margin-top:5px}.edge-layer{position:absolute;inset:0;pointer-events:none}.edge{stroke:#9aacbf;stroke-width:1.2}.side{padding:16px}.side h2{margin-top:0}.side pre{white-space:pre-wrap;word-break:break-word;background:#f6f8fc;padding:10px;border-radius:8px;max-height:430px;overflow:auto;font-size:11px}.status{font-size:12px;color:#adc1e8}.summary{font-size:13px;color:#66758c;line-height:1.55}@media(max-width:900px){.wrap{grid-template-columns:1fr}.side{order:-1}}
</style>
</head>
<body>
<header><strong>Research Space · 실제 ANE E2E</strong><span class="status" id="status">loading…</span></header>
<div class="wrap">
  <section class="panel graph"><div id="graph" class="inner"></div></section>
  <aside class="panel side">
    <h2 id="title">후기 우루크 초기 문자</h2>
    <p class="summary" id="summary">실제 연구 질문 패키지를 로드해 Claim, Evidence, Debate, Position, Uncertainty를 한 공간에서 검증합니다.</p>
    <div id="counts" class="summary"></div>
    <hr>
    <span class="tag" id="type">NODE</span>
    <h3 id="nodeTitle">노드를 선택하세요</h3>
    <pre id="data">{}</pre>
  </aside>
</div>
<script type="module">
import { loadContextPackage, buildCanvasLayout } from './context-package-loader.mjs';
const URL='../../examples/context-package.uruk-writing.json';
const graphEl=document.querySelector('#graph');
function counts(nodes){return nodes.reduce((a,n)=>(a[n.type]=(a[n.type]||0)+1,a),{});}
function select(node){document.querySelector('#type').textContent=node.type;document.querySelector('#nodeTitle').textContent=node.label;document.querySelector('#data').textContent=JSON.stringify(node.data,null,2);}
try{
  const {package:pkg,graph}=await loadContextPackage(URL);
  const nodes=buildCanvasLayout(graph);
  document.querySelector('#status').textContent=`${pkg.review.status} · ${nodes.length} nodes · ${graph.edges.length} edges`;
  document.querySelector('#title').textContent=pkg.question.original;
  document.querySelector('#counts').innerHTML=Object.entries(counts(nodes)).map(([k,v])=>`<div><b>${k}</b> · ${v}</div>`).join('');
  const byId=new Map(nodes.map(n=>[n.id,n]));
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('class','edge-layer');svg.setAttribute('width','1240');svg.setAttribute('height','780');
  graph.edges.forEach(e=>{const a=byId.get(e.from),b=byId.get(e.to);if(!a||!b)return;const line=document.createElementNS('http://www.w3.org/2000/svg','line');line.setAttribute('x1',a.x+95);line.setAttribute('y1',a.y+39);line.setAttribute('x2',b.x+95);line.setAttribute('y2',b.y+39);line.setAttribute('class','edge');line.setAttribute('data-relation',e.relation);svg.appendChild(line);});
  graphEl.appendChild(svg);
  nodes.forEach(node=>{const el=document.createElement('button');el.className=`node ${node.type}`;el.style.left=`${node.x}px`;el.style.top=`${node.y}px`;el.innerHTML='<span class="tag"></span><span class="label"></span>';el.querySelector('.tag').textContent=node.type;el.querySelector('.label').textContent=node.label;el.onclick=()=>select(node);graphEl.appendChild(el);});
}catch(error){document.querySelector('#status').textContent='load failed';document.querySelector('#summary').textContent=error.message;}
</script>
</body>
</html>
