name: cdli-live-verify

on:
  workflow_dispatch:
  push:
    branches:
      - chore/ane101-roadmap
    paths:
      - "src/ane_context_ai/cdli.py"
      - "src/ane_context_ai/cdli_manifest.py"
      - "src/ane_context_ai/cli.py"
      - "data/manifests/r002-source-pack-v0.1.json"
      - ".github/workflows/cdli-live-verify.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run live verification
        id: verify
        continue-on-error: true
        run: |
          PYTHONPATH=src python -m ane_context_ai verify-cdli \
            data/manifests/r002-source-pack-v0.1.json \
            --output verification/r002-source-pack-v0.1.live.json \
            --timeout 30

      - name: Summarize verification
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("verification/r002-source-pack-v0.1.live.json")
          if not path.exists():
              summary = "## CDLI live verification\n\nNo result file was produced.\n"
          else:
              payload = json.loads(path.read_text(encoding="utf-8"))
              run = payload.get("verification_run", {})
              summary = (
                  "## CDLI live verification\n\n"
                  f"- Attempted: {run.get('attempted', 0)}\n"
                  f"- Resolved: {run.get('resolved', 0)}\n"
                  f"- Errors: {run.get('errors', 0)}\n"
                  f"- Retrieved at: {run.get('retrieved_at', 'unknown')}\n"
                  "- Candidate records remain unpromoted until human review.\n"
              )
          Path("verification/summary.md").parent.mkdir(parents=True, exist_ok=True)
          Path("verification/summary.md").write_text(summary, encoding="utf-8")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as out:
              out.write(summary)
          PY

      - name: Upload verification result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r002-cdli-live-verification
          path: verification/
          if-no-files-found: warn
          retention-days: 14

      - name: Fail when verification had errors
        if: steps.verify.outcome != 'success'
        run: exit 1
